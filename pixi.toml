[workspace]
name = "omni-sklearn-metrics"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
scikit-learn = "1.7.*"
numpy = "2.5.*"
pyyaml = "6.0.*"
threadpoolctl = "3.*"  # run.py: one BLAS thread per worker

[tasks]
test = "python test_run.py"
export-env = "pixi workspace export conda-environment envs/sklearn.yml && sed -i 's/^name: default/name: sklearn/' envs/sklearn.yml"
